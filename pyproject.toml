[tool.pytest.ini_options]
markers = ["spark: needs Java and a local Spark session (slow)"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
